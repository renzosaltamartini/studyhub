<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada · StudyHub</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3f1e9;--ink:#11120f;--acid:#c7ff3a;--violet:#7a5cff;--muted:#6f7168}*{box-sizing:border-box}html,body{height:100%;margin:0}body{min-height:100dvh;padding:24px;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;background-image:linear-gradient(rgba(17,18,15,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(17,18,15,.06) 1px,transparent 1px);background-size:40px 40px}.notfound{width:min(680px,100%);padding:34px;border:2px solid var(--ink);background:#fffef9;box-shadow:12px 12px 0 var(--ink);display:grid;grid-template-columns:180px 1fr;gap:24px 38px;align-items:center;text-align:left}.notfound-brand{grid-column:1/-1;padding-bottom:18px;border-bottom:1px solid var(--ink);display:flex;align-items:center;gap:9px;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}.notfound-brand img{width:28px;height:28px}.cat-scene{position:relative;width:150px;height:125px;animation:catFloat 3s ease-in-out infinite}.cat-body{position:absolute;left:31px;bottom:5px;width:82px;height:70px;border:3px solid var(--ink);background:var(--acid);z-index:2}.cat-ear{position:absolute;top:-18px;width:29px;height:32px;border:3px solid var(--ink);background:var(--acid);transform:rotate(45deg);z-index:-1}.cat-ear-left{left:3px}.cat-ear-right{right:3px}.cat-face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:21px;padding-top:4px}.cat-eye{width:6px;height:9px;background:var(--ink);animation:catBlink 4.2s infinite}.cat-nose{position:absolute;top:43px;left:50%;width:7px;height:5px;background:var(--ink);transform:translateX(-50%)}.cat-tail{position:absolute;right:2px;bottom:14px;width:48px;height:56px;border:4px solid var(--ink);border-left:0;border-bottom:0;transform-origin:4px 48px;animation:tailWag 1.7s ease-in-out infinite alternate}.cat-shadow{position:absolute;left:19px;bottom:0;width:100px;height:10px;background:#d9d6ca;animation:shadowPulse 3s ease-in-out infinite}.notfound-code{margin:0;font-size:clamp(92px,17vw,150px);line-height:.72;font-weight:700;letter-spacing:-.08em}.notfound-title{grid-column:2;margin:-18px 0 0;font-size:clamp(28px,5vw,44px);line-height:.95;letter-spacing:-.055em}.notfound-button{grid-column:2;margin-top:-4px;width:max-content;min-height:44px;padding:0 16px;border:1px solid var(--ink);background:var(--ink);color:#fff;text-decoration:none;display:inline-flex;align-items:center;font-size:11px;font-weight:700;box-shadow:4px 4px 0 var(--acid);transition:.16s}.notfound-button:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--acid)}@keyframes catFloat{50%{transform:translateY(-7px) rotate(1deg)}}@keyframes catBlink{0%,44%,50%,100%{transform:scaleY(1)}46%,48%{transform:scaleY(.12)}}@keyframes tailWag{from{transform:rotate(-10deg)}to{transform:rotate(13deg)}}@keyframes shadowPulse{50%{transform:scaleX(.8);opacity:.45}}@media(max-width:620px){.notfound{grid-template-columns:1fr;text-align:center;padding:26px 20px}.notfound-brand{justify-content:center}.cat-scene{margin:auto}.notfound-code,.notfound-title,.notfound-button{grid-column:1}.notfound-title{margin:0}.notfound-button{margin:0 auto}}@media(prefers-reduced-motion:reduce){.cat-scene,.cat-eye,.cat-tail,.cat-shadow{animation:none}}
</style>
</head>
<body>

<div class="notfound">
    <span class="notfound-brand"><img src="/sh.png" alt="">StudyHub</span>
    <div class="cat-scene" aria-hidden="true">
        <div class="cat-shadow"></div>
        <div class="cat-tail"></div>
        <div class="cat-body">
            <span class="cat-ear cat-ear-left"></span>
            <span class="cat-ear cat-ear-right"></span>
            <div class="cat-face">
                <span class="cat-eye"></span>
                <span class="cat-eye"></span>
            </div>
            <span class="cat-nose"></span>
        </div>
    </div>
    <p class="notfound-code">404</p>
    <h1 class="notfound-title">Esta página no existe</h1>
    <a class="notfound-button" href="https://stdyhub.vercel.app">
        <span>Volver al inicio</span>
    </a>
</div>

</body>
</html>
