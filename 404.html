<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>StudyHub</title>
<script>
    // StudyHub usa rutas dinámicas como /study/<nombre>/ y /study/<nombre>/hub/
    // que no existen como archivos reales en el hosting estático.
    // Guardamos la ruta pedida y redirigimos al archivo real que sabe interpretarla.
    (function () {
        var path = window.location.pathname + window.location.search + window.location.hash;
        try {
            sessionStorage.setItem("sh-redirect-path", path);
        } catch (e) {
            // sessionStorage no disponible: seguimos igual, solo perdemos el path exacto.
        }

        if (path.indexOf("/study") === 0) {
            window.location.replace("/study/index.html");
        } else {
            window.location.replace("/");
        }
    })();
</script>
</head>
<body></body>
</html>
