<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada · StudyHub</title>
<meta name="robots" content="noindex">
<script>
    (function () {
        if (!/^\/contacto\/chat\/\d+\/?$/.test(window.location.pathname)) return;
        document.documentElement.style.visibility = "hidden";
        fetch("/contacto/chat/", { cache: "no-store" })
            .then(function (response) {
                if (!response.ok) throw new Error("No se pudo cargar el chat");
                return response.text();
            })
            .then(function (html) {
                document.open();
                document.write(html);
                document.close();
            })
            .catch(function () {
                document.documentElement.style.visibility = "visible";
            });
    })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
    :root {
        --bg: #f6f7f5;
        --text: #181a18;
        --muted: #727772;
        --black: #171917;
        --line: #e1e4df;
    }
    * { box-sizing: border-box; }
    html, body {
        height: 100%;
        margin: 0;
    }
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
    }
    .notfound {
        width: 100%;
        max-width: 440px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .notfound-brand {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -.03em;
        color: var(--black);
        margin-bottom: 24px;
    }
    .notfound-brand img { width: 27px; height: 27px; object-fit: contain; }
    .cat-scene {
        position: relative;
        width: 118px;
        height: 94px;
        margin-bottom: 12px;
        animation: catFloat 3s ease-in-out infinite;
    }
    .cat-body {
        position: absolute;
        left: 27px;
        bottom: 0;
        width: 66px;
        height: 58px;
        border: 3px solid var(--black);
        border-radius: 48% 48% 43% 43%;
        background: #ffffff;
        z-index: 2;
    }
    .cat-ear {
        position: absolute;
        top: -15px;
        width: 25px;
        height: 28px;
        border: 3px solid var(--black);
        background: #ffffff;
        transform: rotate(45deg);
        z-index: -1;
    }
    .cat-ear-left { left: 3px; border-radius: 5px 2px 8px 2px; }
    .cat-ear-right { right: 3px; border-radius: 2px 5px 2px 8px; }
    .cat-face {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 17px;
        padding-top: 3px;
    }
    .cat-eye {
        width: 5px;
        height: 8px;
        border-radius: 50%;
        background: var(--black);
        animation: catBlink 4.2s infinite;
    }
    .cat-nose {
        position: absolute;
        top: 34px;
        left: 50%;
        width: 6px;
        height: 5px;
        border-radius: 50% 50% 60% 60%;
        background: var(--black);
        transform: translateX(-50%);
    }
    .cat-tail {
        position: absolute;
        right: 7px;
        bottom: 10px;
        width: 42px;
        height: 48px;
        border: 4px solid var(--black);
        border-left: 0;
        border-bottom: 0;
        border-radius: 0 30px 0 0;
        transform-origin: 4px 42px;
        animation: tailWag 1.7s ease-in-out infinite alternate;
    }
    .cat-shadow {
        position: absolute;
        left: 22px;
        bottom: -4px;
        width: 76px;
        height: 9px;
        border-radius: 50%;
        background: #e1e4df;
        animation: shadowPulse 3s ease-in-out infinite;
    }
    .notfound-code {
        margin: 0;
        font-size: clamp(64px, 18vw, 96px);
        line-height: 1;
        font-weight: 700;
        letter-spacing: -.04em;
        color: var(--black);
    }
    .notfound-title {
        margin: 18px 0 0;
        font-size: clamp(19px, 4vw, 22px);
        font-weight: 600;
        color: var(--black);
    }
    .notfound-text {
        margin: 10px 0 0;
        max-width: 340px;
        color: var(--muted);
        font-size: 14.5px;
        line-height: 1.6;
    }
    .notfound-button {
        margin-top: 32px;
        min-height: 44px;
        padding: 0 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 11px;
        background: var(--black);
        color: #fff;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        transition: transform .2s ease, background .2s ease;
    }
    .notfound-button:hover {
        background: #2d2d2d;
        transform: translateY(-1px);
    }
    .notfound-button:focus-visible {
        outline: 2px solid var(--black);
        outline-offset: 3px;
    }
    @media (max-width: 420px) {
        .notfound-brand { margin-bottom: 20px; }
        .notfound-button { width: 100%; }
    }
    @keyframes catFloat {
        0%, 100% { transform: translateY(0) rotate(-1deg); }
        50% { transform: translateY(-7px) rotate(1deg); }
    }
    @keyframes catBlink {
        0%, 44%, 50%, 100% { transform: scaleY(1); }
        46%, 48% { transform: scaleY(.12); }
    }
    @keyframes tailWag {
        from { transform: rotate(-10deg); }
        to { transform: rotate(13deg); }
    }
    @keyframes shadowPulse {
        0%, 100% { transform: scaleX(1); opacity: .8; }
        50% { transform: scaleX(.78); opacity: .45; }
    }
    @media (prefers-reduced-motion: reduce) {
        .cat-scene, .cat-eye, .cat-tail, .cat-shadow { animation: none; }
    }
</style>
</head>
<body>


<div class="notfound">
    <span class="notfound-brand"><img src="/sh.png" alt="">StudyHub</span>
    <div class="cat-scene" aria-hidden="true">
        <div class="cat-shadow"></div>
        <div class="cat-tail"></div>
        <div class="cat-body">
            <span class="cat-ear cat-ear-left"></span>
            <span class="cat-ear cat-ear-right"></span>
            <div class="cat-face">
                <span class="cat-eye"></span>
                <span class="cat-eye"></span>
            </div>
            <span class="cat-nose"></span>
        </div>
    </div>
    <p class="notfound-code">404</p>
    <h1 class="notfound-title">Esta página no existe</h1>
    <a class="notfound-button" href="https://stdyhub.vercel.app">
        <span>Volver al inicio</span>
    </a>
</div>

</body>
</html>
