<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Completa tu perfil de StudyHub.">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Primer ingreso | StudyHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/study/study.css">
</head>
<body>
    <header class="auth-header">
        <div class="header-content">
            <div class="header-left ingreso-header-left">
                <a class="brand" href="/" aria-label="StudyHub - Inicio">
                    <span class="brand-mark"><img src="/sh.png" alt=""></span><span class="brand-name">StudyHub</span>
                </a>
            </div>
        </div>
    </header>

    <main>
        <div class="loading-shell" id="loadingView"><span class="spinner"></span><span>Comprobando tu cuenta...</span></div>
        <section class="intake-shell hidden" id="formView">
            <div class="intake-card">
                <div class="intake-head">
                    <span class="eyebrow"><i class="fa-solid fa-user-check"></i> Primer ingreso</span>
                    <h1>Completa tu perfil</h1>
                    <p>Necesitamos estos datos antes de abrir tu panel. La información se guardará únicamente cuando completes y envíes todo el formulario.</p>
                </div>
                <form id="intakeForm" novalidate>
                    <div class="form-grid">
                        <div class="form-field full">
                            <label for="fullName">Nombre y apellido</label>
                            <input id="fullName" name="fullName" type="text" disabled>
                            <span class="field-note"><i class="fa-solid fa-lock"></i> Obtenido de tu cuenta de Google</span>
                        </div>
                        <div class="form-field">
                            <label for="age">Edad</label>
                            <input id="age" name="age" type="number" min="13" max="120" inputmode="numeric" required>
                        </div>
                        <div class="form-field">
                            <label for="email">Email</label>
                            <input id="email" name="email" type="email" disabled>
                        </div>
                        <div class="form-field">
                            <label for="country">País</label>
                            <input id="country" name="country" type="text" maxlength="80" autocomplete="country-name" required>
                        </div>
                        <div class="form-field">
                            <label for="address">Dirección</label>
                            <input id="address" name="address" type="text" maxlength="160" autocomplete="street-address" required>
                        </div>
                        <div class="form-field full">
                            <label for="occupation">Ocupación</label>
                            <select id="occupation" name="occupation" required>
                                <option value="">Selecciona una opción</option>
                                <option value="profesional">Profesional</option>
                                <option value="estudiante">Estudiante</option>
                                <option value="desempleado">Desempleado</option>
                            </select>
                        </div>
                        <div class="form-field full hidden" id="occupationDetailField">
                            <label for="occupationDetail" id="occupationDetailLabel">Cuéntanos más</label>
                            <input id="occupationDetail" name="occupationDetail" type="text" maxlength="120">
                        </div>
                    </div>
                    <p class="form-error hidden" id="formError" role="alert"></p>
                    <button class="submit-button" id="submitButton" type="submit">Guardar y entrar al panel</button>
                </form>
            </div>
        </section>
    </main>
    <script type="module" src="/study/panel/ingreso/ingreso.js"></script>
</body>
</html>
