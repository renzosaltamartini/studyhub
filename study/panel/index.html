<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tu espacio personal de StudyHub.">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Panel personal | StudyHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/study/study.css">
</head>
<body>
    <header class="auth-header">
        <div class="header-content">
            <div class="header-left">
                <a class="brand" id="brandLink" href="#" aria-label="StudyHub - Inicio">
                    <span class="brand-mark"><img src="/sh.png" alt=""></span><span class="brand-line"></span><span class="brand-name">StudyHub</span>
                </a>
                <a class="back-button" id="backButton" href="#"><i class="fa-solid fa-arrow-left"></i><span>Inicio</span></a>
            </div>
        </div>
    </header>

    <main>
        <!-- CARGANDO SESIÓN -->
        <div class="loading-shell" id="loadingView">
            <span class="spinner" aria-hidden="true"></span>
            <span>Cargando tu espacio...</span>
        </div>

        <!-- PANEL: intro + bienvenida -->
        <section class="auth-shell hidden" id="panelView">
            <div class="intro" aria-labelledby="intro-title">
                <span class="eyebrow space-eyebrow">
                    <span>Tu espacio de</span><span id="spaceWord" class="space-word">estudio</span>
                </span>
                <h1 id="intro-title">Todo lo que necesitas, en un solo lugar.</h1>
            </div>

            <div class="auth-card">
                <div class="account-view">
                    <div class="avatar" id="avatar"><img src="/sh.png" alt="StudyHub"></div>
                    <span class="eyebrow success" id="sessionStatus"><span class="status-dot"></span>Comprobando sesión</span>
                    <h2 id="greeting">¡Hola, <span id="userName">estudiante</span>!</h2>
                    <div class="profile-details hidden" id="profileDetails">
                        <div class="profile-detail"><i class="fa-solid fa-briefcase" aria-hidden="true"></i><span id="userOccupation"></span></div>
                        <div class="profile-detail"><i class="fa-solid fa-earth-americas" aria-hidden="true"></i><span id="userCountry"></span></div>
                    </div>
                    <p id="loggedOutMessage"></p>
                    <div id="loggedActions">
                        <a class="hub-button" id="hubLink" href="/study/hub"><span>Entrar al Hub</span><i class="fa-solid fa-arrow-right"></i></a>
                        <a class="contact-panel-link" id="contactPanelLink" href="/?contacto=1">
                            <span class="contact-panel-icon"><i class="fa-regular fa-comments"></i></span>
                            <span class="contact-panel-copy"><strong id="contactPanelTitle">Contacto</strong><small id="contactPanelStatus">Comprobando chats...</small></span>
                            <span class="contact-panel-badge hidden" id="contactPanelBadge">0</span>
                            <i class="fa-solid fa-chevron-right contact-panel-arrow"></i>
                        </a>
                        <button class="logout-button" id="logoutButton" type="button">Cerrar sesión</button>
                    </div>
                    <button class="hub-button hidden" id="loginButton" type="button"><i class="fa-brands fa-google"></i><span>Iniciar sesión con Google</span></button>
                </div>
            </div>
        </section>

    </main>

    <script type="module" src="/study/study.js"></script>
</body>
</html>
