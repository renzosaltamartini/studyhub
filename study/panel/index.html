<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tu espacio personal de StudyHub.">
    <title>StudyHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../study.css">
</head>
<body>
    <header class="auth-header">
        <div class="header-content">
            <div class="header-left">
                <a class="brand" id="brandLink" href="#" aria-label="StudyHub - Inicio">
                    <span class="brand-mark">SH</span><span class="brand-line"></span><span class="brand-name">StudyHub</span>
                </a>
                <a class="back-button" id="backButton" href="#"><i class="fa-solid fa-arrow-left"></i><span>Inicio</span></a>
            </div>
        </div>
    </header>

    <main>
        <!-- CARGANDO SESIÓN -->
        <div class="loading-shell" id="loadingView">
            <span class="spinner" aria-hidden="true"></span>
            <span>Cargando tu espacio...</span>
        </div>

        <!-- PANEL: intro + bienvenida -->
        <section class="auth-shell hidden" id="panelView">
            <div class="intro" aria-labelledby="intro-title">
                <span class="eyebrow space-eyebrow">
                    <span class="status-dot"></span>
                    <span>Tu espacio de&nbsp;</span><span id="spaceWord" class="space-word">estudio</span>
                </span>
                <h1 id="intro-title">Todo lo que necesitas, en un solo lugar.</h1>
            </div>

            <div class="auth-card">
                <div class="account-view">
                    <div class="avatar" id="avatar">SH</div>
                    <span class="eyebrow success"><span class="status-dot"></span>Sesión iniciada</span>
                    <h2>¡Hola, <span id="userName">estudiante</span>!</h2>
                    <p id="userEmail"></p>
                    <a class="hub-button" id="hubLink" href="#"><span>Entrar al Hub</span><i class="fa-solid fa-arrow-right"></i></a>
                    <button class="logout-button" id="logoutButton" type="button">Cerrar sesión</button>
                </div>
            </div>
        </section>

    </main>

    <script type="module" src="../study.js"></script>
</body>
</html>
