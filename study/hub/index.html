<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub | StudyHub</title>
</head>
<body>
    <script>
        const params = new URLSearchParams(window.location.search);
        const name = params.get("name");

        if (name) {
            const hubBaseURL = new URL(".", document.baseURI);
            const destination = new URL(`${encodeURIComponent(name)}/`, hubBaseURL);
            history.replaceState(null, "", destination.pathname);
        }
    </script>
</body>
</html>
