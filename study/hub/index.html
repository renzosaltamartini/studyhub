<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Hub | StudyHub</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="/study/hub/hub.css"></head>
<body><div class="hub-loading" id="hubLoading"><span class="hub-spinner"></span><span>Cargando tu Hub...</span></div>
<div class="dashboard hidden" id="dashboard"><div class="sidebar-opener" id="sidebarOpener"><button class="sidebar-open-button" id="sidebarOpenButton" type="button" aria-label="Abrir menú"><i class="fa-solid fa-bars"></i></button><button class="floating-theme-button theme-toggle" type="button" aria-label="Activar tema oscuro"><i class="fa-regular fa-moon"></i></button><div class="user-pill" id="userPill"><span class="pill-value" id="pillValue">usuario</span></div></div><div class="sidebar-overlay" id="sidebarOverlay"></div><aside class="sidebar" id="sidebar">
<div class="sidebar-brand"><span class="brand-mark"><img src="/sh.png" alt=""></span><span class="brand-text">StudyHub</span><button class="collapse-button" id="collapseButton" type="button" aria-label="Contraer menú"><i class="fa-solid fa-angle-left"></i></button></div>
<div class="sidebar-menu-head"><span>Menú</span><button class="section-toggle" type="button" data-target="sidebarNav" aria-label="Ocultar sección Menú" aria-expanded="true"><i class="fa-solid fa-angle-up"></i></button></div><nav class="sidebar-nav" id="sidebarNav" aria-label="Menú principal"><button class="nav-item active" type="button"><i class="fa-regular fa-bell"></i><span>Recordatorios</span></button><button class="nav-item" type="button"><i class="fa-regular fa-calendar"></i><span>Calendario</span></button><button class="nav-item" type="button"><i class="fa-regular fa-folder-open"></i><span>Archivos</span></button></nav><div class="sidebar-menu-head space-head"><span>Tu espacio</span><button class="section-toggle" type="button" data-target="spaceNav" aria-label="Ocultar sección Tu espacio" aria-expanded="true"><i class="fa-solid fa-angle-up"></i></button></div><nav class="sidebar-nav empty-nav" id="spaceNav" aria-label="Tu espacio"></nav><div class="sidebar-menu-head help-head"><span>Ayuda</span><button class="section-toggle" type="button" data-target="helpNav" aria-label="Ocultar sección Ayuda" aria-expanded="true"><i class="fa-solid fa-angle-up"></i></button></div><nav class="sidebar-nav help-nav" id="helpNav" aria-label="Ayuda"><button class="nav-item" type="button"><i class="fa-regular fa-comments"></i><span>Contactar staff</span></button></nav>
<div class="sidebar-user"><div class="user-avatar" id="hubAvatar"><img src="/sh.png" alt="StudyHub"></div><div class="user-data"><strong id="hubUserName">Usuario</strong><span>Cuenta activa</span></div><div class="user-actions"><button class="user-action sidebar-theme-button theme-toggle" type="button" aria-label="Activar tema oscuro" title="Cambiar tema"><i class="fa-regular fa-moon"></i></button><button class="user-action logout" id="hubLogout" type="button" aria-label="Cerrar sesión" title="Cerrar sesión"><i class="fa-solid fa-arrow-right-from-bracket"></i></button></div></div>
</aside><main class="hub-main"><header class="mobile-header"><button id="mobileMenuButton" type="button" aria-label="Abrir menú"><i class="fa-solid fa-bars"></i></button><strong>StudyHub</strong></header><section class="hub-placeholder"><span class="placeholder-icon"><i class="fa-regular fa-bell"></i></span><h1 id="sectionTitle">Recordatorios</h1><p>Este espacio está listo para que agreguemos su contenido.</p></section></main></div><script type="module" src="/study/hub/hub.js"></script></body></html>
