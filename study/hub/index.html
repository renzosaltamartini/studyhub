<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub | StudyHub</title>
</head>
<body>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";
        import { firebaseConfig } from "/firebase-config.js";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.replace("/study/panel");
                return;
            }
            try {
                const snapshot = await get(ref(database, `users/${user.uid}/profile`));
                if (!snapshot.val()?.completed) window.location.replace("/study/panel/ingreso");
            } catch (error) {
                console.error(error);
                window.location.replace("/study/panel/ingreso");
            }
        });
    </script>
</body>
</html>
