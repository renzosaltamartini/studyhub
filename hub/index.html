<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub | StudyHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/styles.css">
    <style>
        .hub-container {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .welcome-card {
            background: #ffffff;
            border: 1px solid #e5e5e5;
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
        }
        .user-avatar-large {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 20px;
            object-fit: cover;
        }
        .avatar-placeholder-large {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #eff6ff;
            color: #2563eb;
            font-size: 28px;
            font-weight: 700;
            display: grid;
            place-items: center;
            margin: 0 auto 20px;
        }
        .logout-btn {
            margin-top: 24px;
            background: #f5f5f5;
            color: #525252;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .logout-btn:hover {
            background: #fee2e2;
            color: #dc2626;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <header class="navbar-header">
        <nav class="navbar-container">
            <a href="/" class="navbar-logo">
                <span class="logo-short">SH</span>
                <span class="logo-divider"></span>
                <span class="logo-name">StudyHub</span>
            </a>
            <a href="/" class="login-button"><i class="fa-solid fa-arrow-left"></i> Volver al Inicio</a>
        </nav>
    </header>

    <main class="hub-container">
        <!-- Cargando -->
        <div id="loading" style="text-align: center;">
            <p>Verificando acceso...</p>
        </div>

        <!-- Vista Autorizada -->
        <div id="welcomeView" class="welcome-card hidden">
            <div id="avatarContainer"></div>
            <h1 style="font-size: 28px; font-weight: 700; margin-bottom: 8px;">
                ¡Bienvenido a tu Hub, <span id="userName"></span>!
            </h1>
            <p style="color: #737373; font-size: 14px;">
                Este es tu espacio privado donde podrás gestionar todos tus estudios.
            </p>
            <button id="logoutBtn" class="logout-btn">
                <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión
            </button>
        </div>

        <!-- Vista No Autorizada -->
        <div id="deniedView" class="welcome-card hidden">
            <i class="fa-solid fa-lock" style="font-size: 40px; color: #dc2626; margin-bottom: 16px;"></i>
            <h2 style="font-size: 22px; margin-bottom: 8px;">Acceso Denegado</h2>
            <p style="color: #737373; font-size: 14px; margin-bottom: 20px;">
                Debes iniciar sesión para acceder a este Hub.
            </p>
            <a href="/login" class="login-button" style="display: inline-flex;">Iniciar Sesión</a>
        </div>
    </main>

    <script type="module" src="hub.js"></script>
</body>
</html>
